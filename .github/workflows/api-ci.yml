name: MediFlow API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow_ci_password
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mediflow:mediflow_ci_password@localhost:5432/mediflow_test?schema=public
      JWT_ACCESS_SECRET: ci-only-test-secret-do-not-use-in-production
      ACCESS_TOKEN_TTL: "900"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start S3-compatible storage
        working-directory: .
        run: |
          docker run -d \
            --name mediflow-silo \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=mediflowadmin \
            -e MINIO_ROOT_PASSWORD=LocalDevOnly_ChangeMe_9284 \
            pgsty/silo:RELEASE.2026-10-18T00-00-00Z \
            server /data --console-address :9001

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              echo "S3-compatible storage is healthy."
              exit 0
            fi
            sleep 2
          done

          docker logs mediflow-silo
          exit 1

      - name: Create or verify private documents bucket
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: mediflow-private-docs
          S3_ACCESS_KEY_ID: mediflowadmin
          S3_SECRET_ACCESS_KEY: LocalDevOnly_ChangeMe_9284
        run: |
          node --input-type=module <<'NODE'
          import {
            S3Client,
            HeadBucketCommand,
            CreateBucketCommand,
          } from "@aws-sdk/client-s3";

          const client = new S3Client({
            endpoint: process.env.S3_ENDPOINT,
            region: "us-east-1",
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.S3_ACCESS_KEY_ID,
              secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
            },
          });

          const Bucket = process.env.S3_BUCKET;

          try {
            await client.send(new HeadBucketCommand({ Bucket }));
            console.log(`Bucket already exists: ${Bucket}`);
          } catch {
            await client.send(new CreateBucketCommand({ Bucket }));
            console.log(`Created bucket: ${Bucket}`);
          } finally {
            client.destroy();
          }
          NODE

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        env:
          STORAGE_PROVIDER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: mediflow-private-docs
          S3_ACCESS_KEY_ID: mediflowadmin
          S3_SECRET_ACCESS_KEY: LocalDevOnly_ChangeMe_9284
        run: npm run test:e2e