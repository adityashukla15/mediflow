
name: MediFlow API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: mediflow_ci_password
          POSTGRES_DB: mediflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediflow -d mediflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mediflow:mediflow_ci_password@localhost:5432/mediflow_test?schema=public
      JWT_ACCESS_SECRET: ci-only-test-secret-do-not-use-in-production
      ACCESS_TOKEN_TTL: "900"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e
